<section class="panel quick-panel"><h2>{{ t('Quick note') }}</h2><p class="quiet">{{ t('Write first, organize later. Ctrl+Enter to save.') }}</p><form class="quick-form" action="{{ url_for('quick_note') }}" method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="token" value="{{ quick_token }}">{% if event is defined %}<input type="hidden" name="event_id" value="{{ event.id }}">{% endif %}<label class="sr-only" for="quick-body">{{ t('Quick note') }}</label><textarea id="quick-body" name="body" rows="3" maxlength="20000" placeholder="{{ t('Capture what the teacher just said…') }}" required></textarea><button>{{ t('Save quick note') }}</button><span class="quick-result" role="status" aria-live="polite"></span></form></section><script src="{{ url_for('static',filename='quick.js') }}" defer></script>
