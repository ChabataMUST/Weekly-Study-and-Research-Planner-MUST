{% extends 'base.html' %}{% block content %}<a href="{{ url_for('note_detail',id=note.id) }}">← {{ t('Back to record') }}</a><h1>{{ t('File this note') }}</h1><p>{{ note.title }}</p><section class="panel"><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label for="course">{{ t('Course') }}</label><select name="course" id="course"><option value="">—</option>{% for c in courses %}<option value="{{ c.id }}">{{ c.title }}</option>{% endfor %}</select><label for="project">{{ t('Research project') }}</label><select name="project" id="project"><option value="">—</option>{% for p in projects %}<option value="{{ p.id }}">{{ p.title }}</option>{% endfor %}</select><p>{{ t('Choose one course or one project.') }}</p><button>{{ t('Save') }}</button></form></section>{% endblock %}
